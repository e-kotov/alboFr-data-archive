name: Update Tiger Mosquito Data

on:
  schedule:
    - cron: '27 3 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without committing, creating a release, or triggering Zenodo"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force_release:
        description: "Force release and Zenodo deposit even if data hash has not changed"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      LC_COLLATE: C
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute ISO Date Version
        id: date
        run: |
          iso_date=$(date -I)
          echo "iso_date=$iso_date" >> $GITHUB_OUTPUT

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Set Up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R packages
        run: |
          Rscript -e "install.packages('pak')"
          Rscript -e "pak::pak(c('rlang', 'RcppSimdJson', 'jsonlite', 'digest', 'curl'))"

      - name: Install alboFr
        run: |
          Rscript -e 'pak::pak("e-kotov/alboFr")'

      - name: Fetch Data and Save as GeoJSON
        run: |
          Rscript scripts/fetch_data.R \
            --output=tiger_mosquito_colonisation_in_france.geojson \
            --page-output=raw_source_page.html \
            --max-retries=5 \
            --timeout=180

      - name: Compare data and write metadata
        id: compare
        run: |
          Rscript - <<'EOF'
          library(jsonlite)
          library(alboFr)

          data_path <- "tiger_mosquito_colonisation_in_france.geojson"
          source_page_path <- "raw_source_page.html"
          previous_path <- tempfile(fileext = ".geojson")
          git_status <- system2("git", c("show", paste0("HEAD:", data_path)), stdout = previous_path, stderr = FALSE)
          if (!identical(git_status, 0L)) {
            file.create(previous_path)
          }

          current_hash <- alboFr::get_tiger_mosquito_dataset_hash(data_path)
          previous_hash <- if (file.info(previous_path)$size > 0) {
            alboFr::get_tiger_mosquito_dataset_hash(previous_path)
          } else {
            NA_character_
          }
          force_release <- identical(Sys.getenv("INPUT_FORCE_RELEASE"), "true")
          changed <- !identical(current_hash, previous_hash) || force_release
          release_tag <- paste0(Sys.getenv("ISO_DATE"), "-", substr(current_hash, 1, 8))

          source_official_update_date <- if (file.exists(source_page_path)) {
            page_text <- paste(readLines(source_page_path, warn = FALSE, encoding = "UTF-8"), collapse = "\n")
            alboFr:::parse_tiger_mosquito_update_date(page_text)
          } else {
            alboFr::get_tiger_mosquito_colonisation_metadata()$source_official_update_date
          }

          metadata <- list(
            source_url = "https://signalement-moustique.anses.fr/signalement_albopictus/colonisees",
            source_official_update_date = source_official_update_date,
            fetched_at = format(Sys.time(), "%Y-%m-%dT%H:%M:%SZ", tz = "UTC"),
            data_canonical_sha256 = current_hash,
            previous_data_canonical_sha256 = previous_hash,
            features = length(jsonlite::fromJSON(data_path, simplifyVector = FALSE)$features),
            unique_canonical_features = length(unique(
              alboFr::get_tiger_mosquito_feature_hashes(data_path))),
            alboFr_version = as.character(utils::packageVersion("alboFr")),
            alboFr_remote_sha = utils::packageDescription("alboFr")$RemoteSha,
            workflow_run_id = Sys.getenv("GITHUB_RUN_ID"),
            release_tag = release_tag
          )

          writeLines(toJSON(metadata, auto_unbox = TRUE, pretty = TRUE, null = "null"), "metadata.json")
          if (changed) {
            history_status <- system2("Rscript", c("scripts/build_feature_history.R",
                                                   paste0("--data=", data_path),
                                                   "--metadata=metadata.json",
                                                   "--output=feature_history.csv",
                                                   "--ledger=feature_history_snapshots.csv"))
            if (!identical(history_status, 0L)) {
              stop("build_feature_history.R failed with status ", history_status)
            }
          }
          official_date_str <- if (!is.null(metadata$source_official_update_date) &&
                                   length(metadata$source_official_update_date) > 0 &&
                                   !is.na(metadata$source_official_update_date) &&
                                   nzchar(metadata$source_official_update_date)) {
            as.character(metadata$source_official_update_date)
          } else {
            "Unavailable / unparsed"
          }

          snapshot <- c(
            "# Tiger Mosquito Data Snapshot Metadata",
            "",
            sprintf("Weekly automated snapshot of French tiger mosquito (*Aedes albopictus*) colonisation data from ANSES captured on **%s**.", Sys.getenv("ISO_DATE")),
            "",
            "## Summary",
            sprintf("- **Archive Execution Date**: `%s`", Sys.getenv("ISO_DATE")),
            sprintf("- **Fetched at (UTC)**: `%s`", metadata$fetched_at),
            sprintf("- **Official Source Update Date**: `%s`", official_date_str),
            sprintf("- **Active Commune Features**: `%s`", metadata$features),
            sprintf("- **Unique Canonical Features**: `%s`", metadata$unique_canonical_features),
            sprintf("- **Canonical Dataset SHA-256**: `%s`", metadata$data_canonical_sha256),
            sprintf("- **Previous Dataset SHA-256**: `%s`", metadata$previous_data_canonical_sha256),
            sprintf("- **alboFr Package Version**: `%s` (commit `%s`)", metadata$alboFr_version, metadata$alboFr_remote_sha),
            sprintf("- **Workflow Run ID**: `%s`", metadata$workflow_run_id),
            sprintf("- **Release Tag**: `%s`", metadata$release_tag),
            sprintf("- **Source URL**: %s", metadata$source_url),
            "",
            "> Upstream data is published periodically by ANSES. This repository checks for updates weekly and creates a new release and Zenodo deposit whenever a change in the canonical dataset is detected."
          )
          writeLines(snapshot, "SNAPSHOT.md")

          release_body <- paste(
            sprintf("### Tiger Mosquito Colonisation in France — Snapshot %s", metadata$release_tag),
            "",
            sprintf("Snapshot of official ANSES tiger mosquito (*Aedes albopictus*) colonisation data for France (official source update date: **%s**), captured during the weekly automated archive run on **%s**.", official_date_str, Sys.getenv("ISO_DATE")),
            "",
            "#### Snapshot Details",
            sprintf("- **Archive Execution Date**: `%s`", Sys.getenv("ISO_DATE")),
            sprintf("- **Fetched at (UTC)**: `%s`", metadata$fetched_at),
            sprintf("- **Official Source Update Date**: `%s`", official_date_str),
            sprintf("- **Active Commune Polygons**: `%s`", metadata$features),
            sprintf("- **Canonical Dataset SHA-256**: `%s`", metadata$data_canonical_sha256),
            sprintf("- **Previous Dataset SHA-256**: `%s`", metadata$previous_data_canonical_sha256),
            sprintf("- **alboFr Version**: `%s` (commit `%s`)", metadata$alboFr_version, metadata$alboFr_remote_sha),
            "",
            "> Upstream data is published periodically by [ANSES](https://signalement-moustique.anses.fr/signalement_albopictus/colonisees). This archive repository checks for updates every week and automatically creates a new release and Zenodo deposit whenever a change in the canonical feature dataset is detected.",
            sep = "\n"
          )

          cat(sprintf("changed=%s\n", tolower(changed)), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          cat(sprintf("data_hash=%s\n", current_hash), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          cat(sprintf("release_tag=%s\n", release_tag), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          cat("release_body<<EOF\n", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          cat(release_body, "\n", sep = "", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          cat("EOF\n", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          EOF
        env:
          ISO_DATE: ${{ steps.date.outputs.iso_date }}
          INPUT_FORCE_RELEASE: ${{ inputs.force_release }}

      - name: Commit Updated Data Files
        if: steps.compare.outputs.changed == 'true' && inputs.dry_run != 'true'
        uses: EndBug/add-and-commit@v9
        with:
          message: "Archive tiger mosquito colonisation data for ${{ steps.date.outputs.iso_date }} (${{ steps.compare.outputs.data_hash }}) [skip ci]"
          add: "tiger_mosquito_colonisation_in_france.geojson metadata.json SNAPSHOT.md feature_history.csv feature_history_snapshots.csv"
          push: true

      - name: Stage files for packaging
        if: steps.compare.outputs.changed == 'true' || inputs.dry_run == 'true'
        run: |
          rm -rf tiger-mosquito-data
          mkdir tiger-mosquito-data
          cp -r tiger_mosquito_colonisation_in_france.geojson metadata.json SNAPSHOT.md feature_history.csv feature_history_snapshots.csv README.md .zenodo.json CITATION.cff LICENSE.md examples tiger-mosquito-data/

      - name: Zip the data bundle
        if: steps.compare.outputs.changed == 'true' || inputs.dry_run == 'true'
        run: |
          zip -r "${{ steps.compare.outputs.release_tag }}-tiger-mosquito-data.zip" \
              tiger-mosquito-data

      - name: Upload dry-run artifact
        if: inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.compare.outputs.release_tag }}-dry-run-tiger-mosquito-data
          path: |
            tiger-mosquito-data
            ${{ steps.compare.outputs.release_tag }}-tiger-mosquito-data.zip

      - name: Create GitHub Release
        if: steps.compare.outputs.changed == 'true' && inputs.dry_run != 'true'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: true
          tag: ${{ steps.compare.outputs.release_tag }}
          name: "Snapshot ${{ steps.compare.outputs.release_tag }}"
          body: ${{ steps.compare.outputs.release_body }}
          draft: false
          prerelease: false
          artifacts: |
            ${{ steps.compare.outputs.release_tag }}-tiger-mosquito-data.zip
            tiger_mosquito_colonisation_in_france.geojson
            feature_history.csv
            feature_history_snapshots.csv
            metadata.json
            SNAPSHOT.md
            README.md
